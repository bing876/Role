<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>休眠图标预览 · Chrome 内存节省模式同款</title>
<style>
  body{margin:0;padding:32px;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#fff;color:#1a1a1a}
  h1{font-size:15px;font-weight:500;margin:0 0 4px}
  h2{font-size:14px;font-weight:500;margin:28px 0 10px;color:#444}
  p{font-size:13px;color:#666;margin:0 0 14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .browserTab{display:flex;align-items:center;gap:2px;min-width:56px;max-width:190px;padding:3px 4px 3px 6px;border:1px solid #dcdcdc;border-radius:8px 8px 0 0;background:#efeff1}
  .browserTab--on{background:#fff;border-color:#3b82f6}
  .browserTab--asleep{background:#e9e9ec}
  .browserTab--asleep.browserTab--on{background:#fff}
  .browserTab__label{border:none;background:transparent;font:inherit;font-size:12px;color:#1a1a1a;cursor:pointer;min-width:0;max-width:140px;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
  .browserTab--asleep .browserTab__label{color:#8a8a8a}
  .browserTab__run{color:#0a7;font-size:10px}
  .browserTab__x{border:none;background:transparent;color:#8a8a8a;cursor:pointer;font-size:11px;line-height:1;padding:2px 3px;border-radius:4px}
  .browserTab__sleep{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px}
  .browserTab__sleep--shallow{opacity:.55}
  .browserTab__sleep--deep{opacity:.85}
  .fav{width:14px;height:14px;border-radius:3px;flex:0 0 auto}
  .note{font-size:12px;color:#8a8a8a;margin-top:6px}
  .sizes{display:flex;gap:24px;align-items:flex-end;margin-top:8px}
  .sizes div{text-align:center;font-size:11px;color:#888}
</style>
</head>
<body>
<h1>休眠图标（Chrome 内存节省模式同款）</h1>
<p>灰色圆底 + 内存条图形。休眠时它替换掉网站原本的 favicon —— 和 Chrome 的做法一致。</p>

<h2>1. 在标签上的实际效果</h2>
<div class="row">
  <div class="browserTab browserTab--on">
    <button class="browserTab__label"><span class="fav" style="background:#ea4335"></span>速卖通 - 商品详情</button>
    <button class="browserTab__x">✕</button>
  </div>
  <div class="browserTab browserTab--asleep">
    <button class="browserTab__label">
      <span class="browserTab__sleep browserTab__sleep--shallow">
        <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="currentColor" opacity="0.14"/><rect x="2.6" y="4.4" width="7" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.7" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="5.55" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="10.35" y="5.6" width="1.1" height="3.8" rx="0.4" fill="currentColor"/></svg>
      </span>1688 供应商列表</button>
    <button class="browserTab__x">✕</button>
  </div>
  <div class="browserTab browserTab--asleep">
    <button class="browserTab__label">
      <span class="browserTab__sleep browserTab__sleep--deep">
        <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="currentColor" opacity="0.14"/><rect x="2.6" y="4.4" width="7" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.7" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="5.55" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="7.4" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="10.35" y="5.6" width="1.1" height="3.8" rx="0.4" fill="currentColor"/></svg>
      </span>chatgpt.com</button>
    <button class="browserTab__x">✕</button>
  </div>
</div>
<p class="note">第 1 张：活跃（正常站点图标）｜ 第 2 张：浅休眠（颗粒 2 颗，浅）｜ 第 3 张：深休眠（颗粒 3 颗，深）</p>

<h2>2. 图标放大看（实际只有 14px）</h2>
<div class="sizes">
  <div>
    <span class="browserTab__sleep browserTab__sleep--shallow" style="width:14px;height:14px">
      <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="currentColor" opacity="0.14"/><rect x="2.6" y="4.4" width="7" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.7" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="5.55" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="10.35" y="5.6" width="1.1" height="3.8" rx="0.4" fill="currentColor"/></svg>
    </span>
    <div>浅休眠 14px</div>
  </div>
  <div>
    <span class="browserTab__sleep browserTab__sleep--deep" style="width:14px;height:14px">
      <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="currentColor" opacity="0.14"/><rect x="2.6" y="4.4" width="7" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.7" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="5.55" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="7.4" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="10.35" y="5.6" width="1.1" height="3.8" rx="0.4" fill="currentColor"/></svg>
    </span>
    <div>深休眠 14px</div>
  </div>
  <div style="transform:scale(4);transform-origin:bottom left;margin-left:20px">
    <span class="browserTab__sleep browserTab__sleep--deep" style="width:14px;height:14px;opacity:1">
      <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="currentColor" opacity="0.14"/><rect x="2.6" y="4.4" width="7" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="3.7" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="5.55" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="7.4" y="5.7" width="1.05" height="2.6" rx="0.3" fill="currentColor"/><rect x="10.35" y="5.6" width="1.1" height="3.8" rx="0.4" fill="currentColor"/></svg>
    </span>
    <div style="margin-top:44px">放大 4 倍</div>
  </div>
</div>
</body>
</html>
