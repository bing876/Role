<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 工作台</title>
    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('root');
        if (el && (!el.children || el.children.length === 0)) {
          el.innerHTML = '<div style="padding:32px;color:#d32f2f;font-family:system-ui,sans-serif;">' +
            '<h2>页面加载遇到错误</h2>' +
            '<p style="font-weight:bold;">' + msg + '</p>' +
            '<pre style="background:#fbe9e7;padding:12px;border-radius:4px;">' + (error && error.stack ? error.stack : url + ':' + lineNo) + '</pre>' +
            '</div>';
        }
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
